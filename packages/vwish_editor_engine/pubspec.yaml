# OWNER: ENG-01 (plugin section shared with ENG-07/ENG-08 per BUILD_PLAN §7; frozen by ENG-06)
name: vwish_editor_engine
description: Native editor engine plugin for iOS (AVFoundation + Core Image/Metal) and Android (AndroidX Media3) implementing the vwish_editor_engine_api contract.
version: 1.1.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.22.0"

# ARCH §4.2 rule 4: vwish_editor_engine_api and vwish_editor_core only (never vwish_editor,
# vwish_features or vwish_transcription).
dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  vwish_editor_core:
    path: ../vwish_editor_core
  vwish_editor_engine_api:
    path: ../vwish_editor_engine_api

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned to the 29.x line (ARCH §12.6); generated files are committed and checked by
  # test/glue/pigeon_regeneration_test.dart.
  pigeon: ^29.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.vecvel.vwish.editor.engine
        pluginClass: VwishEditorEnginePlugin
      ios:
        pluginClass: VwishEditorEnginePlugin
