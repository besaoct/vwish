name: vwish_features
description: UI feature controllers, player screens, overlays, settings menus, and diagnostics HUD.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  desktop_drop: ^0.4.4
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  vwish_domain:
    path: ../vwish_domain
  vwish_engine:
    path: ../vwish_engine
  vwish_data:
    path: ../vwish_data
  vwish_ui_kit:
    path: ../vwish_ui_kit
  vwish_platform:
    path: ../vwish_platform

dev_dependencies:
  flutter_test:
    sdk: flutter
